<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D2A">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="4; url=./index.html">
  <title>Page Not Found — MangoTree Insurance & Investments</title>
  
  <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">
  <link rel="stylesheet" href="./css/tokens.css?v=3">
  <link rel="stylesheet" href="./css/base.css?v=3">
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: var(--s-4);
      background-color: var(--paper);
      color: var(--ink);
      text-align: center;
      font-family: var(--font-body);
    }
    .not-found-card {
      max-width: 440px;
      padding: var(--s-6) var(--s-4);
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-2);
    }
    .not-found-logo {
      height: 48px;
      width: auto;
      margin-bottom: var(--s-4);
    }
    .not-found-title {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 600;
      color: var(--ink);
      margin-bottom: var(--s-2);
    }
    .not-found-desc {
      font-size: var(--fs-body);
      color: var(--ink-muted);
      line-height: var(--lh-relaxed);
      margin-bottom: var(--s-5);
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--canopy-900);
      color: var(--paper);
      padding: 12px 24px;
      border-radius: var(--r-pill);
      font-size: var(--fs-body);
      font-weight: 600;
      text-decoration: none;
      transition: background-color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
    }
    .btn-home:hover {
      background-color: var(--canopy-800);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="not-found-card">
    <img src="./assets/img/logo-mangotree.png" alt="MangoTree Insurance & Investments" class="not-found-logo" width="160" height="48">
    <h1 class="not-found-title">Page Not Found</h1>
    <p class="not-found-desc">
      The link you followed may be broken or outdated. Redirecting to Amit Jain's digital business card in a few seconds...
    </p>
    <a href="./index.html" class="btn-home">
      <span>Go to Digital Card</span>
      <span aria-hidden="true">&rarr;</span>
    </a>
  </main>
</body>
</html>
