<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MangoTree Insurance & Investments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  
  <style>
    /* Temporary styling for Phase 1 */
    .hero-container {
      padding: var(--s-4);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--s-4);
    }
    .logo {
      width: 150px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--fs-hero);
      margin: 0;
      line-height: 1.1;
    }
    h2 {
      font-family: var(--font-ui);
      font-size: var(--fs-body);
      color: var(--ink-2);
      font-weight: normal;
      margin: 0;
    }
    .tagline {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      color: var(--leaf-700);
      margin: var(--s-2) 0;
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <img id="hero-logo" class="logo" src="" alt="MangoTree Logo">
    <div>
      <h1 id="hero-name">Name</h1>
      <h2 id="hero-title">Title</h2>
    </div>
    <p id="hero-tagline" class="tagline" lang="hi-Latn">Tagline</p>
  </div>

  <script type="module">
    import { CONFIG } from './js/config.js';
    
    document.addEventListener("DOMContentLoaded", () => {
      document.title = `${CONFIG.profile.name} | ${CONFIG.profile.title} | ${CONFIG.profile.company}`;
      document.getElementById('hero-name').textContent = CONFIG.profile.name;
      document.getElementById('hero-title').textContent = `${CONFIG.profile.title} — ${CONFIG.profile.company}`;
      document.getElementById('hero-tagline').textContent = CONFIG.profile.tagline;
      document.getElementById('hero-logo').src = './assets/img/logo-mangotree.png';
    });
  </script>
</body>
</html>
